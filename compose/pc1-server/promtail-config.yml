server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  # Читает URL из переменной окружения
  - url: ${LOKI_URL}

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  - job_name: docker_containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: pc1-server
          __path__: /var/lib/docker/containers/*/*log
    
    # Этот блок вытаскивает красивые имена контейнеров из логов Докера
    pipeline_stages:
      - json:
          expressions:
            stream: stream
            attrs: attrs
            tag: attrs.tag
      - regex:
          expression: (?P<image_name>(?:[^|]*[^|])).(?P<container_name>(?:[^|]*[^|])).(?P<image_id>(?:[^|]*[^|])).(?P<container_id>(?:[^|]*[^|]))
          source: tag
      - labels:
          image_name:
          container_name:
          image_id:
          container_id: