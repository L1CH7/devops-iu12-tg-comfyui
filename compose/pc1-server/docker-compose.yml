name: pc1-server

networks:
  app_network:
    driver: bridge

volumes:
  pg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_STORAGE_DIR:-/srv/app-data}/postgres
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_STORAGE_DIR:-/srv/app-data}/minio
  n8n_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_STORAGE_DIR:-/srv/app-data}/n8n
  promtail_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_STORAGE_DIR:-/srv/app-data}/promtail

services:
  # --- 1. Reverse Proxy ---
  caddy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8188:8188"
      - "5678:5678"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - app_network

  # --- 2. Databases & Storage ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.2.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6379"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
    networks:
      - app_network

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}); do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/generations;
      /usr/bin/mc anonymous set public myminio/generations;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - app_network

  # --- 3. Backend & Bot ---
  server-api:
    build:
      context: ../../services/server-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/api/health || curl -f http://127.0.0.1:8000/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  tg-bot:
    build:
      context: ../../services/tg-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    network_mode: "host"
    environment:
      - SERVER_API_URL=http://127.0.0.1:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      server-api:
        condition: service_healthy

  # --- 4. AI & Workflows ---
  n8n-init:
    image: alpine:3.18
    command: >
      sh -c "mkdir -p /data && echo '{\"encryptionKey\": \"${N8N_ENCRYPT_KEY}\"}' > /data/config && chown -R 1000:1000 /data"
    volumes:
      - n8n_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.21.1
    restart: unless-stopped
    environment:
      - N8N_HOST=${PC1_YGG_IP}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://[${PC1_YGG_IP}]:5678
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPT_KEY}
      - N8N_USER_MANAGEMENT_DISABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app_network
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5678/healthz || curl -f http://127.0.0.1:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  comfyui:
    image: yanwk/comfyui-boot:cu126-slim
    restart: unless-stopped
    gpus: all
    volumes:
      - ${COMFYUI_MODELS_PATH:-/srv/storage-models/models}:/root/ComfyUI/models
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8188/ || curl -f http://127.0.0.1:8188/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

# -- Закомментировано за текущей ненадобностью --
#  llama-cpp:
#    image: ghcr.io/ggml-org/llama.cpp:server-cuda13-b9115
#    restart: unless-stopped
#    volumes:
#      - ../../storage-models/models:/models
#    environment:
#      - LLAMA_ARG_MODEL=/models/${LLAMA_MODEL_FILE:-model.gguf}
#      - LLAMA_ARG_HOST=0.0.0.0
#      - LLAMA_ARG_PORT=8080
#    gpus: all
#    networks:
#      - app_network

  # --- 5. Observability (Отправка логов на ПК 2) ---
  promtail:
    image: grafana/promtail:3.6.10
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_data:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    # В конфиге promtail будет указан адрес отправки через переменную LOKI_URL
    networks:
      - app_network

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    ports:
      - "9100:9100"
    networks:
      - app_network

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.2.1
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility,compute
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "9835:9835"
    networks:
      - app_network
