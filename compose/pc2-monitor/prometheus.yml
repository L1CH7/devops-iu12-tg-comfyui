global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Мониторим сам Прометей
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Мониторим сервисы на ПК1 (если они будут отдавать метрики)
  - job_name: "pc1_services"
    # Подставится IP-адрес из переменной
    static_configs:
      - targets: 
          # Пример: если сервер API отдает метрики на порту 8000
          - "${PC1_TARGET}:8000"