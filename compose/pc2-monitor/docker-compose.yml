name: pc2-monitor

networks:
  monitor_network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command: 
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Если нужно расширение переменных, используйте --enable-feature=expand-external-labels
      # Но для targets оно обычно не работает напрямую в конфиге.
    ports:
      - "9090:9090" # Доступно внутри Yggdrasil
    # Прокидываем LAN IP первого компа внутрь контейнера (если используется внешнее расширение)
    # environment:
    #   - PC1_TARGET=${PC1_LAN_IP}
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "pc1-lan:${PC1_LAN_IP}"
    networks:
      - monitor_network

  loki:
    image: grafana/loki:3.7.1
    restart: unless-stopped
    user: root # Для обхода проблем с правами на запись в /loki при локальном запуске
    ports:
      - "0.0.0.0:3100:3100" # Сюда Promtail с ПК1 будет слать логи
    volumes:
      - loki_data:/loki
    networks:
      - monitor_network

  grafana:
    image: grafana/grafana:12.4.3
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitor_network

  promtail:
    image: grafana/promtail:3.6.10
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_data:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitor_network

  # Утилита для нагрузочного тестирования API на ПК 1
  k6:
    image: grafana/k6:0.49.0
    profiles:
      - load-testing # Запускается только вручную: docker-compose --profile load-testing up k6
    networks:
      - monitor_network

  # --- 2. Alerting & Heartbeat ---
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    networks:
      - monitor_network
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    # TODO: Настроить отправку вебхуков в админский ТГ при падении ПК1

  tg-bot-stub:
    image: ealen/echo-server:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - monitor_network
